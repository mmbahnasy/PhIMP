<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Incident - OCP AIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --canada-red: #c8102e;
        --canada-red-deep: #8f0b21;
        --canada-red-soft: #fbe7eb;
        --canada-white: #ffffff;
        --canada-ink: #1f2937;
        --canada-border: #f5c8d0;
      }
      body {
        background: linear-gradient(180deg, #ffffff 0%, #fff2f3 100%);
        color: var(--canada-ink);
      }
      .canada-red { background-color: var(--canada-red); }
      .canada-btn { background-color: var(--canada-red); color: white; }
      .canada-btn:hover { background-color: var(--canada-red-deep); }
      .canada-card { background: white; border: 1px solid var(--canada-border); box-shadow: 0 10px 25px rgba(200, 16, 46, 0.08); }
      .canada-pill { background: var(--canada-red-soft); color: var(--canada-red-deep); border: 1px solid #f7d5dc; }
      .maple-icon { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
      .canada-border { border-color: var(--canada-border); }
      .canada-text { color: var(--canada-red-deep); }
    </style>
</head>
<body class="bg-white text-slate-800 font-sans">
    <div class="min-h-screen flex flex-col">
        <header class="canada-red text-white shadow-md border-b-4 border-red-100">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="{{ url_for('static', filename='images/Maple_Leaf.png') }}" alt="Maple Leaf" class="maple-icon rounded-md bg-white/10 p-1">
                    <h1 class="text-xl font-semibold">OCP AIMS Incident Management Portal</h1>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-red-100">{{ current_user.full_name if current_user else 'User' }}</span>
                    <a href="/logout" class="text-sm bg-white text-red-700 hover:bg-red-50 px-3 py-1.5 rounded transition font-medium">Log out</a>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Medication Incident & Near Miss Report</h2>
                <p class="text-sm text-slate-600 mb-6">This form captures the mandatory OCP and ISMP data fields for ongoing CQI and anonymized NIDR submission.</p>

                <form method="POST" action="/report" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Event Type *</label>
                            <select name="event_type" id="event_type" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required onchange="toggleHarm()">
                                <option value="Incident">Medication Incident (Reached Patient)</option>
                                <option value="Near Miss">Near Miss (Intercepted)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Type of Incident *</label>
                            <select name="incident_type" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                                <option value="Incorrect drug">Incorrect drug</option>
                                <option value="Incorrect patient">Incorrect patient</option>
                                <option value="Incorrect dose">Incorrect dose</option>
                                <option value="Incorrect route">Incorrect route</option>
                                <option value="Incorrect frequency">Incorrect frequency</option>
                                <option value="Medication omission">Medication omission</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Date Incident Occurred *</label>
                            <input type="date" name="date" value="{{ today }}" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Time Incident Occurred *</label>
                            <input type="time" name="time" value="14:30" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Patient Age Range *</label>
                            <select name="age_range" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                                <option value="0-9 years">0-9 years</option>
                                <option value="10-19 years">10-19 years</option>
                                <option value="20-29 years">20-29 years</option>
                                <option value="30-39 years">30-39 years</option>
                                <option value="40-49 years" selected>40-49 years</option>
                                <option value="50-59 years">50-59 years</option>
                                <option value="60-69 years">60-69 years</option>
                                <option value="70-79 years">70-79 years</option>
                                <option value="80+ years">80+ years</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Patient Gender *</label>
                            <select name="patient_gender" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Non-binary">Non-binary</option>
                                <option value="Unknown">Unknown</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Incident Discovered By *</label>
                            <select name="discovered_by" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                                <option value="Pharmacist">Pharmacist</option>
                                <option value="Technician">Technician</option>
                                <option value="Patient">Patient</option>
                                <option value="Caregiver">Caregiver</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Medication Prescribed By *</label>
                            <select name="prescribed_by" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                                <option value="Physician">Physician</option>
                                <option value="Pharmacist">Pharmacist</option>
                                <option value="Other prescriber">Other prescriber</option>
                                <option value="Patient self-managed">Patient self-managed</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Medication(s) Involved *</label>
                            <input type="text" name="medications_involved" placeholder="e.g., Amoxicillin 500mg" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Medication System Stage(s) Involved *</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                            <label><input type="checkbox" name="medication_system_stages" value="Prescribing"> Prescribing</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Order entry"> Order entry</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Verification"> Verification</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Dispensing"> Dispensing</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Administration"> Administration</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Monitoring"> Monitoring</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Documentation"> Documentation</label>
                            <label><input type="checkbox" name="medication_system_stages" value="Transition of care"> Transition of care</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Route of Administration *</label>
                            <select name="route" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
                                <option value="Oral">Oral</option>
                                <option value="Topical">Topical</option>
                                <option value="Injectable">Injectable</option>
                                <option value="Inhalation">Inhalation</option>
                                <option value="Ocular">Ocular</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div id="harm_container">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Degree of Harm *</label>
                            <select name="harm_level" id="harm_level" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                                <option value="None">None</option>
                                <option value="Mild">Mild</option>
                                <option value="Moderate">Moderate</option>
                                <option value="Severe">Severe</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Associated Factors *</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                            <label><input type="checkbox" name="associated_factors" value="Central Fill"> Central Fill</label>
                            <label><input type="checkbox" name="associated_factors" value="Compliance Packaging"> Compliance Packaging</label>
                            <label><input type="checkbox" name="associated_factors" value="Compounded medication"> Compounded medication</label>
                            <label><input type="checkbox" name="associated_factors" value="Injection by pharmacy professional"> Injection by pharmacy professional</label>
                            <label><input type="checkbox" name="associated_factors" value="Transition of care"> Transition of care</label>
                            <label><input type="checkbox" name="associated_factors" value="None of the above"> None of the above</label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Incident Description *</label>
                        <textarea name="incident_description" rows="3" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Contributing Factors *</label>
                        <textarea name="contributing_factors" rows="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Actions Taken at the Pharmacy Level *</label>
                        <textarea name="actions_taken" rows="3" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required></textarea>
                    </div>

                    <div class="flex justify-end space-x-4 pt-4 border-t">
                        <a href="/" class="px-5 py-2.5 border rounded-lg text-slate-700 text-sm">Cancel</a>
                        <button type="submit" class="px-5 py-2.5 bg-red-700 hover:bg-red-900 text-white rounded-lg text-sm font-medium">Save Incident Record</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
    function toggleHarm() {
        const t = document.getElementById('event_type').value;
        document.getElementById('harm_container').style.opacity = (t === 'Near Miss') ? '0.35' : '1';
        document.getElementById('harm_level').disabled = (t === 'Near Miss');
        if (t === 'Near Miss') {
            document.getElementById('harm_level').value = 'None';
        }
    }
    </script>
</body>
</html>
